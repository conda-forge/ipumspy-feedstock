{% set name = "ipumspy" %}
{% set version = "0.10.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: b8caaa30aeb13b7abd6143206a6424ece661e435ccd60c23c8867191c61f6969

build:
  number: 0
  entry_points:
    - ipums = ipumspy.cli:cli
  script: {{ PYTHON }} -m pip install . -vv
  noarch: python

requirements:
  host:
    - pip
    - python {{ python_min }}
    - hatchling >=1.27

  run:
    - click >=8.0.0,<9
    - pandas >=2.2.3,<4
    - numpy >2.0.0,<3
    - pyarrow >=23.0.0,<27
    - python >={{ python_min }}
    - pyyaml >=6.0.1,<7.0.0
    - requests >=2.32.5,<3.0.0
    - importlib-metadata >=4.13.0,<5

test:
  requires:
    - python {{ python_min }}
  imports:
    - ipumspy
    - ipumspy.api
  commands:
    - ipums --help

about:
  home: The package home page
  license: MPL-2.0
  license_family: MOZILLA
  license_file: LICENSE
  summary: A collection of tools for working with IPUMS data
  doc_url: https://ipumspy.readthedocs.io/en/latest/
  dev_url:

extra:
  recipe-maintainers:
    - renae-r
